# Autumn compositor — upstream yshui/picom v13 or newer.
# Reference: https://picom.app/ and the v13 man/picom.1.adoc.
# Start only inside the i3 supervisor, without --daemon.
# Durations are seconds. VSync follows the display; no fixed 60 Hz limit.

backend = "glx";
vsync = true;
use-damage = true;
xrender-sync-fence = true;
unredir-if-possible = false;
dbus = false;
use-ewmh-active-win = true;
log-level = "warn";

# Animation scripts handle visibility, so legacy fading stays disabled.
fading = false;
blur-background = false;
blur-method = "dual_kawase";
blur-strength = 6;
frame-opacity = 1.0;
shadow = false;
corner-radius = 0;
shadow-radius = 14;
shadow-opacity = 0.20;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-color = "#000000";

rules = (
    {
        # Animate ordinary application windows only. Menus, panels, screen
        # lockers and notifications must appear immediately and stay opaque.
        match = "!override_redirect && !fullscreen && "
                "(window_type = 'normal' || window_type = 'dialog' || "
                "class_g = 'i3-frame') && "
                "class_g !?= 'Polybar' && class_g !?= 'Dunst' && "
                "class_g !?= 'i3lock' && class_g !?= 'Rofi' && name != 'i3lock'";
        shadow = true;
        corner-radius = 8;
        blur-background = true;
        # 15% transparency for focused windows (see the "focused" rule).
        # i3 keeps inactive tabs mapped and raises the newly focused tab.
        # A tiny focus opacity difference provides a real transition trigger.
        opacity = 0.83;
        animations = (
            {
                triggers = ["open"];
                suppressions = ["size", "position", "increase-opacity", "decrease-opacity"];
                preset = "appear";
                scale = 0.97;
                duration = 0.20;
            },
            {
                triggers = ["close"];
                suppressions = ["size", "position", "increase-opacity", "decrease-opacity", "hide"];
                preset = "disappear";
                scale = 0.90;
                duration = 0.22;
            },
            {
                # i3 workspace changes show/hide individual windows.
                # This is not a whole-desktop sliding animation.
                triggers = ["show"];
                suppressions = ["size", "position", "increase-opacity", "decrease-opacity"];
                preset = "slide-in";
                direction = "up";
                duration = 0.17;
            },
            {
                triggers = ["hide"];
                suppressions = ["size", "position", "increase-opacity", "decrease-opacity"];
                preset = "slide-out";
                direction = "down";
                duration = 0.18;
            },
            {
                # Also runs on tab focus changes, which do not map/unmap a window.
                triggers = ["increase-opacity"];
                suppressions = ["size", "position"];
                opacity = {
                    curve = "cubic-bezier(0.16, 1.0, 0.3, 1.0)";
                    duration = 0.18;
                    start = 0.35;
                    end = "window-raw-opacity";
                };
                shadow-opacity = "opacity";
            },
            {
                triggers = ["decrease-opacity"];
                opacity = {
                    duration = 0.10;
                    start = "window-raw-opacity-before";
                    end = "window-raw-opacity";
                };
                shadow-opacity = "opacity";
            },
            {
                # Layout changes (Mod+W tabbed / Mod+E split) move and resize
                # windows; this slides them to their new place. It also
                # affects mouse drag/resize.
                triggers = ["geometry"];
                preset = "geometry-change";
                duration = 0.16;
            }
        );
    },
    {
        match = "focused";
        opacity = 0.85;
    },
    {
        match = "fullscreen || override_redirect || "
                "window_type = 'dock' || window_type = 'desktop' || "
                "window_type = 'notification' || class_g ?= 'Polybar' || "
                "class_g ?= 'Dunst' || class_g ?= 'Rofi' || "
                "class_g ?= 'i3lock' || name = 'i3lock'";
        shadow = false;
        opacity = 1.0;
        corner-radius = 0;
        blur-background = false;
    }
);
