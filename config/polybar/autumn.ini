[colors]
background = #211d19
surface = #342a22
foreground = #e5d5c3
muted = #a89785
amber = #e7b56d
copper = #cc915f
sage = #a9b180
red = #bf6e5d

[bar/autumn]
monitor = ${env:AUTUMN_MONITOR:}
width = 100%
height = 36
background = ${colors.background}
foreground = ${colors.foreground}
border-bottom-size = 2
border-bottom-color = ${colors.surface}
line-size = 2
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = Fira Code:style=Medium:size=10;3
font-1 = DejaVu Sans:size=10;3
modules-left = launcher i3
modules-center = date
modules-right = network audio microphone xkeyboard power
tray-position = ${env:AUTUMN_TRAY:right}
tray-padding = 6
tray-maxsize = 18
tray-background = ${colors.background}
override-redirect = false
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/launcher]
type = custom/text
content = " AUTUMN "
content-foreground = ${colors.amber}
click-left = python3 ~/.config/i3/autumn/desktop.py menu
click-right = rofi -config ~/.config/rofi/autumn.rasi -show drun

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
format = <label-state> <label-mode>
label-focused = %name%
label-focused-padding = 1
label-focused-background = ${colors.surface}
label-focused-foreground = ${colors.amber}
label-focused-underline = ${colors.copper}
label-unfocused = %index%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.muted}
label-visible = %index%
label-visible-padding = 1
label-visible-foreground = ${colors.foreground}
label-urgent = %index% !
label-urgent-padding = 1
label-urgent-background = ${colors.red}
label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.amber}

[module/date]
type = internal/date
interval = 5
date = %a  %d %b
date-alt = %Y-%m-%d
time = %H:%M
time-alt = %H:%M:%S
label = %date%   %time%
label-foreground = ${colors.amber}

[module/network]
type = custom/text
content = "NET"
content-foreground = ${colors.sage}
click-left = nm-connection-editor
click-right = nm-connection-editor

[module/audio]
type = custom/script
exec = python3 -u ~/.config/i3/autumn/audio.py watch-output
tail = true
label = %output%
label-foreground = ${colors.foreground}
click-left = python3 ~/.config/i3/autumn/audio.py outputs
click-middle = python3 ~/.config/i3/autumn/audio.py mute-output
click-right = pavucontrol
scroll-up = python3 ~/.config/i3/autumn/audio.py volume-up
scroll-down = python3 ~/.config/i3/autumn/audio.py volume-down

[module/microphone]
type = custom/script
exec = python3 -u ~/.config/i3/autumn/audio.py watch-input
tail = true
label = %output%
label-foreground = ${colors.sage}
click-left = python3 ~/.config/i3/autumn/audio.py inputs
click-middle = python3 ~/.config/i3/autumn/audio.py mute-input
click-right = python3 ~/.config/i3/autumn/audio.py mute-input

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
format = <label-layout> <label-indicator>
label-layout = %icon%
label-layout-foreground = ${colors.amber}
layout-icon-default = ?
layout-icon-0 = us;EN
layout-icon-1 = ru;RU
layout-icon-2 = ua;UA
label-indicator-on-capslock = CAPS
label-indicator-on-capslock-foreground = ${colors.red}

[module/power]
type = custom/text
content = "SESSION"
content-foreground = ${colors.copper}
click-left = python3 ~/.config/i3/autumn/desktop.py power
click-right = python3 ~/.config/i3/autumn/desktop.py help

[settings]
screenchange-reload = true
pseudo-transparency = false
